# Conexão Airbyte: CRM → S3 Raw
# Liga o source (CRM PostgreSQL) ao destination (S3 Raw)

name: "CRM Clientes → S3 Raw"
source_id: "source_postgres_crm"
destination_id: "destination_s3_raw"

schedule:
  # Cron: todo dia às 02:00 (mesmo schedule do DAG Airflow)
  cron_expression: "0 2 * * *"
  timezone: "America/Sao_Paulo"

streams:
  - name: "clientes"
    sync_mode: "incremental"
    destination_sync_mode: "append"   # Adiciona ao destino (não substitui)
    cursor_field: "data_cadastro"
    primary_key: ["cpf"]

status: "active"
_nota: "Esta conexão é orquestrada pelo Airflow (dag_ingestion_clientes.py)"
