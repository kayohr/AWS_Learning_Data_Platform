# =============================================================================
# airflow.cfg - Configurações do Apache Airflow
# =============================================================================
# CONCEITO AWS MWAA:
#   No MWAA, muitas destas configurações são gerenciadas pela AWS.
#   Você configura via console: MWAA → Environment → Airflow configuration options
#
#   Configurações mais importantes no MWAA:
#     - core.executor: CeleryExecutor (workers distribuídos)
#     - core.dags_folder: S3 bucket com os DAGs
#     - database.sql_alchemy_conn: RDS Aurora PostgreSQL (gerenciado)
#
# Localmente: usamos LocalExecutor (tasks rodam no mesmo processo do scheduler)
# =============================================================================

[core]
# Pasta onde ficam os DAGs
dags_folder = /opt/airflow/dags

# Executor: define como as tasks são executadas
# LocalExecutor: tasks rodam em processos separados no mesmo servidor
# CeleryExecutor: tasks distribuídas em workers (AWS MWAA usa este)
# KubernetesExecutor: cada task em um pod Kubernetes
executor = LocalExecutor

# Paralelismo máximo (tasks simultâneas)
parallelism = 16
max_active_tasks_per_dag = 16

# Não carregar exemplos (limpa a interface)
load_examples = False

# Timezone (IMPORTANTE para empresas brasileiras!)
default_timezone = America/Sao_Paulo

# Formato de datas nos logs
default_ui_timezone = America/Sao_Paulo

[database]
# String de conexão com o PostgreSQL
# Formato: postgresql+psycopg2://usuario:senha@host:porta/banco
sql_alchemy_conn = postgresql+psycopg2://dataplatform_user:dataplatform_pass123@postgres:5432/airflow_db

# Pool de conexões com o banco
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10

[scheduler]
# Frequência que o scheduler verifica DAGs (em segundos)
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5

# Número de DAG runs que o scheduler dispara por loop
max_dagruns_to_create_per_loop = 10

[webserver]
# Porta da interface web
web_server_port = 8080

# Fuso horário da interface web
default_ui_timezone = America/Sao_Paulo

# Autenticação (em produção: usar OAuth/LDAP)
authenticate = True
auth_backend = airflow.contrib.auth.backends.password_auth

[smtp]
# Configuração de e-mail para alertas
# No AWS: usaria Amazon SES (Simple Email Service)
smtp_host = smtp.gmail.com
smtp_starttls = True
smtp_ssl = False
smtp_port = 587
smtp_mail_from = alertas@minha-empresa.com

[logging]
# Nível de log
logging_level = INFO

# Pasta de logs (localmente: volume Docker)
base_log_folder = /opt/airflow/logs

# No MWAA: logs vão automaticamente para CloudWatch Logs
# remote_logging = True
# remote_base_log_folder = s3://meu-bucket/airflow-logs/
# remote_log_conn_id = aws_default
